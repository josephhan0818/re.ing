<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    
    /* 啟動按鈕 */
    #start-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: white;
      text-align: center;
    }
    
    #start-container.hidden {
      display: none;
    }
    
    #start-button {
      background: #007bff;
      color: white;
      border: none;
      padding: 20px 40px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin: 20px;
    }
    
    #start-button:hover {
      background: #0056b3;
    }
    
    #start-button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    /* 調試信息 */
    #debug {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px;
      border-radius: 5px;
      font-size: 11px;
      z-index: 999;
      max-width: 250px;
      font-family: monospace;
      display: none;
    }
    
    /* 狀態指示器 */
    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>
  <!-- 啟動界面 -->
  <div id="start-container">
    <h2>🎯 AR 圖像追蹤應用</h2>
    <p>請點擊下方按鈕啟動相機並開始 AR 體驗</p>
    <button id="start-button">📷 啟動相機開始 AR</button>
    <div id="loading" style="display: none;">
      <p>正在啟動相機...</p>
    </div>
  </div>
  
  <!-- 調試信息 -->
  <div id="debug">載入中...</div>
  
  <!-- 狀態提示 -->
  <div id="status">請對準目標圖像</div>
  
  <!-- AR 場景 -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; showStats: false;"
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; colorManagement: true;">

    <a-camera look-controls="false" position="0 0 0"></a-camera>

    <!-- AR 目標 -->
    <a-entity mindar-image-target="targetIndex: 0" id="target0">
      <!-- 測試用紅色盒子 -->
      <a-box 
        id="test-box"
        position="0 0 0.2"
        width="0.3" 
        height="0.3" 
        depth="0.1"
        color="red"
        visible="false">
      </a-box>
      
      <!-- AR 圖片 -->
      <a-plane 
        id="ar-image"
        position="0 0 0.1"
        width="1.2" 
        height="1.2"
        material="src: ./arobj.png; transparent: true; alphaTest: 0.1;"
        visible="false">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    let targetFound = false;
    let persistentMode = false;
    let arStarted = false;
    let isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    // DOM 元素
    const startContainer = document.getElementById('start-container');
    const startButton = document.getElementById('start-button');
    const loading = document.getElementById('loading');
    const debug = document.getElementById('debug');
    const status = document.getElementById('status');
    const scene = document.querySelector('a-scene');
    
    let debugMessages = [];
    
    // 更新調試信息
    function updateDebug(message) {
      const timestamp = new Date().toLocaleTimeString();
      debugMessages.push(`${timestamp}: ${message}`);
      if (debugMessages.length > 6) {
        debugMessages.shift();
      }
      debug.innerHTML = debugMessages.join('<br>');
      console.log('AR Debug:', message);
    }
    
    // 更新狀態
    function updateStatus(message) {
      status.textContent = message;
      status.style.display = 'block';
    }
    
    // 檢查瀏覽器支持
    function checkSupport() {
      const issues = [];
      
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        issues.push('不支援相機 API');
      }
      
      if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        issues.push('需要 HTTPS 連接');
      }
      
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) {
        issues.push('不支援 WebGL');
      }
      
      return issues;
    }
    
    // 啟動 AR
    async function startAR() {
      try {
        updateDebug('開始啟動 AR...');
        startButton.disabled = true;
        loading.style.display = 'block';
        
        // 檢查支援性
        const issues = checkSupport();
        if (issues.length > 0) {
          throw new Error('瀏覽器不支援: ' + issues.join(', '));
        }
        
        updateDebug('檢查相機權限...');
        
        // 請求相機權限
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280, min: 640 },
            height: { ideal: 720, min: 480 }
          }
        });
        
        updateDebug('相機權限獲取成功');
        
        // 停止測試串流
        stream.getTracks().forEach(track => track.stop());
        
        updateDebug('等待 A-Frame 場景載入...');
        
        // 等待場景載入
        if (!scene.hasLoaded) {
          await new Promise(resolve => {
            scene.addEventListener('loaded', resolve, { once: true });
          });
        }
        
        updateDebug('啟動 MindAR 系統...');
        
        // 啟動 MindAR
        const arSystem = scene.systems['mindar-image'];
        if (!arSystem) {
          throw new Error('MindAR 系統未找到');
        }
        
        await arSystem.start();
        
        updateDebug('AR 系統啟動成功!');
        
        // 隱藏啟動界面
        startContainer.classList.add('hidden');
        debug.style.display = 'block';
        updateStatus('請將相機對準目標圖像');
        
        arStarted = true;
        
      } catch (error) {
        updateDebug(`啟動失敗: ${error.message}`);
        alert(`AR 啟動失敗:\n${error.message}\n\n請確保:\n• 使用 HTTPS 連接\n• 允許相機權限\n• 使用支援的瀏覽器`);
        
        startButton.disabled = false;
        loading.style.display = 'none';
      }
    }
    
    // 顯示 AR 物件
    function showARObjects() {
      const arImage = document.getElementById('ar-image');
      const testBox = document.getElementById('test-box');
      
      updateDebug('顯示 AR 物件');
      
      if (testBox) {
        testBox.setAttribute('visible', true);
      }
      
      if (arImage) {
        arImage.setAttribute('visible', true);
        
        // 手機優化
        if (isMobile) {
          setTimeout(() => {
            const material = arImage.getAttribute('material');
            arImage.setAttribute('material', { ...material, needsUpdate: true });
          }, 100);
        }
      }
      
      updateStatus('🎯 AR 物件已顯示!');
    }
    
    // 隱藏 AR 物件
    function hideARObjects() {
      if (!persistentMode) {
        const arImage = document.getElementById('ar-image');
        const testBox = document.getElementById('test-box');
        
        if (testBox) testBox.setAttribute('visible', false);
        if (arImage) arImage.setAttribute('visible', false);
        
        updateDebug('AR 物件已隱藏');
        updateStatus('請對準目標圖像');
      }
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      updateDebug(isMobile ? '📱 手機模式' : '💻 桌面模式');
      
      // 啟動按鈕事件
      startButton.addEventListener('click', startAR);
      
      // AR 事件監聽
      scene.addEventListener('arReady', function() {
        updateDebug('AR 就緒');
      });
      
      scene.addEventListener('arError', function(event) {
        updateDebug('AR 錯誤: ' + event.detail);
        alert('AR 系統錯誤: ' + event.detail);
      });
      
      // 目標追蹤事件
      const target = document.getElementById('target0');
      
      target.addEventListener('targetFound', function() {
        targetFound = true;
        updateDebug('🎯 目標找到!');
        showARObjects();
        
        // 3秒後啟用持續模式
        setTimeout(() => {
          persistentMode = true;
          updateDebug('🔒 持續模式啟用');
          updateStatus('🔒 圖像將保持顯示 (點擊切換)');
        }, 3000);
      });
      
      target.addEventListener('targetLost', function() {
        targetFound = false;
        updateDebug('目標丟失');
        hideARObjects();
      });
      
      // 觸摸切換持續模式
      document.addEventListener('touchstart', function(e) {
        if (arStarted && (targetFound || persistentMode)) {
          e.preventDefault();
          persistentMode = !persistentMode;
          updateDebug(persistentMode ? '手動啟用持續模式' : '手動關閉持續模式');
          
          if (persistentMode) {
            showARObjects();
            updateStatus('🔒 持續模式啟用');
          } else if (!targetFound) {
            hideARObjects();
          }
        }
      });
      
      // 雙擊切換調試信息
      let touchCount = 0;
      document.addEventListener('touchend', function() {
        touchCount++;
        setTimeout(() => {
          if (touchCount === 2) {
            debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
          }
          touchCount = 0;
        }, 300);
      });
      
      // 預載圖片
      const img = new Image();
      img.onload = () => updateDebug(`圖片載入成功: ${img.width}x${img.height}`);
      img.onerror = () => updateDebug('❌ 圖片載入失敗');
      img.src = './arobj.png';
      
      updateDebug('應用初始化完成');
    });
  </script>
</body>
</html>
