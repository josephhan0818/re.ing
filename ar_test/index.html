<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Camera Kit Web - iOS Ready</title>
<style>
  html,body{margin:0;height:100%}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
         font:16px/1.2 system-ui}
  #start button{padding:14px 20px;border:0;border-radius:10px}
  canvas{display:block;width:100vw;height:100vh}
</style>

<div id="start"><button>點一下啟動相機</button></div>

<script type="module">
  import {
    bootstrapCameraKit,
    createUserMediaSource,
  } from "https://cdn.skypack.dev/@snap/camera-kit";

  // TODO: 把這裡換成「暫存 API 令牌」（Staging API Token）
  const apiToken = "<YOUR_STAGING_API_TOKEN>";
  // 你的 Lens Group ID
  const groupId  = "46fbad1f-5c97-4c13-8700-7503dbd78e0a";

  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);

  // iOS 需使用者互動後才能開鏡頭
  document.querySelector("#start button").addEventListener("click", async () => {
    document.getElementById("start").style.display = "none";

    try {
      // 1) 初始化 SDK
      const cameraKit = await bootstrapCameraKit({ apiToken });

      // 2) 要求後鏡頭
      const media = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }, audio: false
      });
      const source = createUserMediaSource(media);

      // 3) 建立 Session 並綁定畫布
      const session = await cameraKit.createSession({ liveRenderTarget: canvas });
      await session.setSource(source);

      // 4) 載入 Lens Group 並套用第一個 Lens
      const group = await cameraKit.lensRepository.loadLensGroup(groupId);
      if (!group.lenses?.length) throw new Error("Lens Group 為空");
      await session.applyLens(group.lenses[0]);

      // 5) 開始渲染
      await session.play();
    } catch (err) {
      alert("啟動失敗：" + (err?.message || err));
      console.error(err);
    }
  }, { once: true });
</script>
</html>
