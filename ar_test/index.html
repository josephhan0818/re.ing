<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>html,body{margin:0;height:100%}</style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    embedded
    vr-mode-ui="enabled:false">

    <!-- 1) 預載圖片，必要時加 crossorigin -->
    <a-assets timeout="10000">
      <img id="arimg" src="./arobj.png" crossorigin="anonymous">
    </a-assets>

    <a-camera look-controls="false" position="0 0 0"></a-camera>

    <!-- 2) 掃到第 0 張 target 時顯示 -->
    <a-entity mindar-image-target="targetIndex: 0" id="t0">
      <!-- 先用 box 驗證渲染 -->
      <!-- <a-box color="#39f" depth="0.01" height="1" width="1"></a-box> -->

      <!-- 3) 再用圖片，先預設可見 -->
      <a-image src="#arimg"
               position="0 0 0"
               width="1" height="1"
               material="transparent:true; alphaTest:0.05; side:double"
               visible="true">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    // 可選：等找到 target 再顯示
    const t0 = document.querySelector('#t0');
    const img = () => document.querySelector('a-image');
    t0.addEventListener('targetFound', () => img() && img().setAttribute('visible', true));
    t0.addEventListener('targetLost',  () => img() && img().setAttribute('visible', false)); // 想常駐就拿掉這行
  </script>
</body>
</html>
